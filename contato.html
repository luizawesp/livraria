<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria | Contato</title>
    <link rel="stylesheet" href="contato.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">Livraria</a>
        <nav aria-label="Navegação principal">
            <ul class="paginas">
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre mim</a></li>
                <li><a class="active" href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="content">

        <div class = "formulario">
            <p class="eyebrow">Vamos conversar</p>
            <h1>Formulário de contato</h1>
            <form>
                <label>
                    Nome completo:
                    <input type="text" name="nome">
                </label>
                <label>
                    E-mail: 
                    <input type="email" name="email">
                </label>
                <label>
                    Telefone:
                    <input type="tel" name="telefone">
                </label>
                <label>
                    Mensagem:
                    <textarea name="mensagem" rows="4"></textarea>
                </label>
                <button>Enviar</button>
            </form>
        </div>

        <div class="contato">
            <p class="eyebrow">Fale comigo</p>
            <h1>Entre em contato</h1>
            <p>Entre em contato para reservar um livro, realizar doações ou simplesmente deixar uma mensagem.</p>

        </div>
        
    </main>
</body>
</html>
